# `npm run selftest` en cada push y cada PR.
#
# Sin `npm ci` y sin caché: el proyecto no tiene dependencias en tiempo de
# ejecución y la única devDependency es el CLI de Neutralino, que las pruebas no
# usan. Instalar aquí solo añadiría un minuto y una forma más de fallar.
#
# Windows además de Linux, y no por completismo: la mitad de lo que estas
# pruebas cubren es específico de Windows — el dialecto de rutas, `cmd.exe` como
# shell, y matar el árbol de procesos con `taskkill` en vez de con un grupo de
# procesos POSIX. Un CI que solo corriera en Linux dejaría sin mirar justo la
# plataforma en la que se desarrolla esto.
name: selftest

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Sin `npm install`, y eso es la mitad de la prueba: si este trabajo pasa,
  # clonar y ejecutar sigue funcionando sin instalar nada.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['18', '20', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run selftest

  # El lint sí necesita sus dependencias, así que va en un trabajo aparte para
  # no contaminar el de arriba. `--strict` y sin `--fix`: en CI se comprueba, no
  # se corrige — un arreglo automático que nadie ha visto no debería colarse en
  # un PR verde.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
